name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-lint:
    name: Type-check + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Payroll automation invariants
        run: |
          node scripts/test-payroll-bonus-execution.mjs
          node scripts/test-native-payroll-rules.mjs
          node scripts/test-native-automation-state.mjs
          python3 scripts/test-payroll-automation-import.py
      - name: Daily finance comparison invariants
        run: |
          node scripts/test-sales-settlement.mjs
          node scripts/test-settlement-reader.mjs
          node scripts/test-cash-control.mjs
